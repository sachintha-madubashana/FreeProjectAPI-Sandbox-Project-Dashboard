<dialog
  class="dialog"
  aria-labelledby="title"
  aria-describedby="description"
  onclick="
    if (event.target === this) {
      this.close();
      this.remove();
    }
  "
>
  <div class="sm:max-w-md">
    <header>
      <h2 id="title">Task Details</h2>
    </header>
    <section>
      <h1 class="text-2xl font-bold" id="taskTitle">Task Title</h1>
      <p class="text-muted-foreground" id="taskDescription">Task Description</p>
      <div class="grid grid-cols-2 gap-2 my-4" id="taskStatusContainer"></div>
    </section>
    <footer class="flex flex-col md:flex-row">
      <button
        class="btn bg-green-100 dark:bg-green-950 text-green-950 dark:text-green-400 hover:bg-green-200 dark:hover:bg-green-900"
        id="markAsCompleteBtn"
        data-tooltip="Mark as Complete"
        data-side="top"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-circle-check-icon lucide-circle-check"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        Mark as Complete
      </button>
      <button
        class="btn"
        data-variant="outline"
        data-tooltip="Close Dialog"
        data-side="top"
        onclick="
          {
            this.closest('dialog').close();
            this.closest('dialog').remove();
          }
        "
      >
        Cancel
      </button>
    </footer>
    <button
      type="button"
      class="btn"
      data-variant="ghost"
      data-size="icon-sm"
      aria-label="Close dialog"
      onclick="this.closest('dialog').close()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-x-icon lucide-x"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
</dialog>

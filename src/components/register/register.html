<div class="flex justify-center items-center size-full">
  <div class="card w-full md:w-md">
    <header>
      <h2>Title</h2>
      <p>Enter your detailes below to create an account</p>
      <div class="card-action">
        <button type="button" class="btn" data-variant="link" id="goToLoginbtn">
          Log In
        </button>
      </div>
    </header>
    <section>
      <form class="grid gap-6">
        <div class="grid gap-2">
          <label class="label" for="email">Full Name</label>
          <input
            class="input"
            type="text"
            id="name"
            placeholder="Jane Doe"
            required
          />
        </div>
        <div class="grid gap-2">
          <div class="field">
            <label class="label" for="email">Email</label>
            <input
              class="input"
              type="email"
              id="email"
              placeholder="email@example.com"
              required
            />
            <p id="errorMsg" class="hidden">This is an Error message.</p>
          </div>
        </div>
        <div class="grid gap-2">
          <div class="field">
            <label class="label" for="password">Password</label>
            <div class="input-group">
              <input
                id="password"
                type="password"
                placeholder="Enter password"
              />
              <span role="group" data-align="end">
                <button
                  type="button"
                  class="btn btn-icon"
                  data-variant="ghost"
                  data-size="sm"
                  id="passwordVisibilityToggler"
                >
                  <div id="passwordVisibilityIcon" class="size-4"></div>
                </button>
              </span>
            </div>
            <p id="errorMsg" class="hidden">This is an Error message.</p>
          </div>
        </div>
      </form>
    </section>
    <footer class="flex-col gap-2">
      <button type="button" class="btn w-full" id="registerBtn">
        Register
      </button>
    </footer>
  </div>
</div>

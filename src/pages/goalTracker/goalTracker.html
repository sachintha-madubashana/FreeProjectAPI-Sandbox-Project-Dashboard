<div class="tabs" id="tabs-with-icons">
  <div class="flex justify-between items-center">
    <h2 class="text-lg font-bold">Goal Tracker Dashboard</h2>
    <div class="flex items-center gap-2">
      <div
        class="card p-2 max-w-20 md:max-w-60 flex flex-row items-center gap-2 rounded-lg"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-user-icon lucide-user"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <p class="truncate" id="loggedinUserName">Jane Doe</p>
      </div>
      <button
        type="button"
        class="btn"
        data-variant="destructive"
        id="logoutBtn"
      >
        Logout
      </button>
    </div>
  </div>
  <nav
    role="tablist"
    aria-orientation="horizontal"
    class="max-[380px]:w-full max-[380px]:overflow-x-scroll max-[380px]:ps-10"
  >
    <button
      type="button"
      role="tab"
      id="tabsWithIconsTabDashboardBtn"
      aria-controls="tabsWithIconsPanelDashboard"
      aria-selected="true"
      tabindex="0"
    >
      <i
        data-lucide="layout-dashboard"
        class="size-5"
        id="tabDashboardIcon"
      ></i>
      Dashboard
    </button>
    <button
      type="button"
      role="tab"
      id="tabsWithIconsTabTaskBtn"
      aria-controls="tabsWithIconsPanelTask"
      aria-selected="false"
      tabindex="-1"
    >
      <i data-lucide="check-square" class="size-5" id="tabTaskIcon"></i>
      Task
    </button>
    <button
      type="button"
      role="tab"
      id="tabsWithIconsTabGoalBtn"
      aria-controls="tabsWithIconsPanelGoal"
      aria-selected="false"
      tabindex="-1"
    >
      <i data-lucide="Goal" class="size-5" id="tabGoalIcon"></i>
      Goals
    </button>
    <button
      type="button"
      role="tab"
      id="tabsWithIconsTabRemindersBtn"
      aria-controls="tabsWithIconsPanelReminders"
      aria-selected="false"
      tabindex="-1"
    >
      <i data-lucide="Bell" class="size-5" id="tabRemindersIcon"></i>
      Reminders
    </button>
  </nav>

  <div
    role="tabpanel"
    id="tabsWithIconsPanelDashboard"
    aria-labelledby="tabsWithIconsTabDashboardBtn"
    tabindex="0"
    aria-hidden="false"
  ></div>
  <div
    role="tabpanel"
    id="tabsWithIconsPanelTask"
    aria-labelledby="tabsWithIconsTabTaskBtn"
    tabindex="-1"
    aria-hidden="true"
    hidden
  ></div>
  <div
    role="tabpanel"
    id="tabsWithIconsPanelGoal"
    aria-labelledby="tabsWithIconsTabGoalBtn"
    tabindex="-1"
    aria-hidden="true"
    hidden
  ></div>
  <div
    role="tabpanel"
    id="tabsWithIconsPanelReminders"
    aria-labelledby="tabsWithIconsTabRemindersBtn"
    tabindex="-1"
    aria-hidden="true"
    hidden
  ></div>
</div>

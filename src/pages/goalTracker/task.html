<section
  class="grid gap-4 md:grid-cols-2 lg:grid-cols-4 py-2"
  id="taskStatsCardsContainer"
></section>
<section>
  <div class="flex flex-col md:justify-between py-2 gap-2 lg:flex-row">
    <div role="group" class="button-group w-full md:w-auto flex flex-wrap">
      <button type="button" class="btn" data-variant="outline" data-size="lg">
        All
        <span class="badge">13</span>
      </button>
      <button type="button" class="btn" data-variant="outline" data-size="lg">
        Pending
        <span
          class="badge bg-blue-50 text-blue-700 dark:bg-blue-950 dark:text-blue-300"
          >1</span
        >
      </button>
      <button type="button" class="btn" data-variant="outline" data-size="lg">
        Completed
        <span
          class="badge bg-green-50 text-green-700 dark:bg-green-950 dark:text-green-300"
          >10</span
        >
      </button>
      <button type="button" class="btn" data-variant="outline" data-size="lg">
        Overdue
        <span
          class="badge bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-300"
          >2</span
        >
      </button>
    </div>
    <div
      class="flex flex-col md:flex-row gap-2 md:justify-between w-full md:w-fit"
    >
      <div
        role="group"
        aria-label="Search"
        class="button-group w-full md:w-auto"
      >
        <button
          type="button"
          class="btn"
          data-variant="outline"
          aria-label="Search tasks"
        >
          <svg
            class="lucide lucide-search"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg></button
        ><input type="text" class="input" placeholder="Search Taks..." />
      </div>
      <button type="button" class="btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-plus-icon lucide-plus"
        >
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
        Add Task
      </button>
    </div>
  </div>
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    id="taskCardsContainer"
  ></div>
</section>

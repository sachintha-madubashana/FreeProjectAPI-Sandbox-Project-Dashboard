<div id="remindersPage">
  <section
    class="grid gap-4 md:grid-cols-2 lg:grid-cols-4 py-2"
    id="reminderStatsCardsContainer"
  ></section>
  <section>
    <div class="flex flex-col md:justify-between py-2 gap-2 lg:flex-row">
      <div
        role="group"
        class="button-group w-full md:w-auto flex flex-wrap"
        id="reminderStatusFilterGroup"
      >
        <button
          type="button"
          class="btn"
          data-variant="primary"
          data-size="lg"
          id="filterAllRemindersBtn"
        >
          All
        </button>
        <button
          type="button"
          class="btn"
          data-variant="outline"
          data-size="lg"
          id="filterPendingRemindersBtn"
        >
          Pending
        </button>
        <button
          type="button"
          class="btn"
          data-variant="outline"
          data-size="lg"
          id="filterCompletedRemindersBtn"
        >
          Completed
        </button>
        <button
          type="button"
          class="btn"
          data-variant="outline"
          data-size="lg"
          id="filterOverdueRemindersBtn"
        >
          Overdue
        </button>
      </div>
      <div
        class="flex flex-col md:flex-row gap-2 md:justify-between w-full md:w-fit h-fit"
      >
        <div class="input-group">
          <input
            type="text"
            placeholder="Search Taks..."
            id="searchRemindersInput"
          />
          <span role="group" data-align="start" aria-hidden="true">
            <svg
              class="text-muted-foreground lucide lucide-search"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m21 21-4.34-4.34" />
              <circle cx="11" cy="11" r="8" />
            </svg>
          </span>
        </div>
        <button
          type="button"
          class="btn"
          data-variant="secondary"
          id="searchReminderBtn"
        >
          <svg
            class="lucide lucide-search"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </button>
        <div class="border border-accent my-2" aria-hidden="true"></div>
        <button type="button" class="btn" id="addReminderBtn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-plus-icon lucide-plus"
          >
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
          Add Reminder
        </button>
      </div>
    </div>
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
      id="reminderCardsContainer"
    ></div>
  </section>
</div>

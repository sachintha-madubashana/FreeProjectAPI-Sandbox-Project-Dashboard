<section class="flex gap-4" id="pageHeader">
  <div class="flex items-center">
    <i data-lucide="bus" id="icon" class="size-8"></i>
  </div>
  <div class="flex flex-col gap-1">
    <h1 class="text-lg font-bold">Employee App</h1>
    <p class="text-sm">Search and view all employees</p>
  </div>
</section>
<section class="card mt-4" id="tableContainer">
  <header class="flex items-center justify-between px-4">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-users-round preview-icon">
        <path d="M18 21a8 8 0 0 0-16 0" />
        <circle cx="10" cy="8" r="5" />
        <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
      </svg>
      <h2 class="text-lg font-bold">Employee List</h2>
    </div>
    <div class="flex items-center gap-2">
      <input id="searchInput" type="search" placeholder="Search employees"
        class="input input-bordered input-sm w-full max-w-xs" />
      <button id="searchButton" type="button" class="btn btn-sm" data-variant="primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-search preview-icon">
          <path d="m21 21-4.34-4.34" />
          <circle cx="11" cy="11" r="8" />
        </svg>
        Search
      </button>
    </div>
  </header>
  <div class="skeleton h-96 w-auto m-4" id="loadingSkeleton">
    <div class="flex justify-center items-center h-full"><svg aria-label="Loading" role="status"
        class="size-8 animate-spin lucide lucide-loader-circle" xmlns="http://www.w3.org/2000/svg" width="24"
        height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      <p class="text-sm">Loading...</p>
    </div>
  </div>
  <div id="tableContent" class="card py-0 mx-4"></div>
  <footer id="pagination" class="flex flex-wrap items-center justify-between gap-4"></footer>
</section>

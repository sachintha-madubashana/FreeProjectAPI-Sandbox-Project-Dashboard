<div class="tabs" id="tabs-with-icons">
  <div class="flex justify-between items-center">
    <h2 class="text-lg font-bold">Goal Traker Dashboard</h2>
    <button type="button" class="btn" data-variant="destructive" id="logoutBtn">
      Logout
    </button>
  </div>
  <nav role="tablist" aria-orientation="horizontal">
    <button
      type="button"
      role="tab"
      id="tabsWithIconsTabDashboard"
      aria-controls="tabsWithIconsPanelDashboard"
      aria-selected="true"
      tabindex="0"
    >
      <i data-lucide="" class="size-5" id="tabDashboardIcon"></i>
      Dashboard
    </button>
    <button
      type="button"
      role="tab"
      id="tabsWithIconsTabTask"
      aria-controls="tabsWithIconsPanelTask"
      aria-selected="false"
      tabindex="-1"
    >
      <i data-lucide="" class="size-5" id="tabTaskIcon"></i>
      Task
    </button>
  </nav>

  <div
    role="tabpanel"
    id="tabsWithIconsPanelDashboard"
    aria-labelledby="tabsWithIconsTabDashboard"
    tabindex="-1"
  >
    <section
      class="grid gap-4 md:grid-cols-3 lg:grid-cols-4 py-2"
      id="statsCardsContainer"
    ></section>
  </div>
  <div
    role="tabpanel"
    id="tabsWithIconsPanelTask"
    aria-labelledby="tabsWithIconsTabTask"
    tabindex="-1"
    hidden
  >
    this is task UI
  </div>
</div>
